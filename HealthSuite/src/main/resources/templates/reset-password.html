<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Reset Password - HealthSuite')}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar('login')}"></div>

    <div class="main-content">
        <div class="login-container">
            <div class="login-card">
                <h1>🔑 Reset Password</h1>
                <p>Enter your username and choose a new password</p>

                <div th:if="${error}" class="error-message" th:text="${error}"></div>

                <form th:action="@{/reset-password}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autofocus th:value="${username}"
                            placeholder="Enter your username" />
                        <span class="error" th:if="${usernameError}" th:text="${usernameError}"></span>
                    </div>

                    <div class="form-group">
                        <label for="password">New Password</label>
                        <input type="password" id="password" name="password" required
                            placeholder="Enter a new password" />
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm New Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required
                            placeholder="Confirm your new password" />
                        <span class="error" th:if="${passwordError}" th:text="${passwordError}"></span>
                    </div>

                    <button type="submit" class="btn-login">Reset Password</button>
                </form>

                <div class="back-link">
                    Remember your password? <a th:href="@{/login}">Login</a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>

</html>
